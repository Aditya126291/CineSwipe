<svg width="500" height="750" viewBox="0 0 500 750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="placeholder-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <stop offset="0%" stop-color="#7c3aed" />
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="500" height="750" fill="url(#placeholder-grad)" rx="40" />
  
  <!-- Film Roll Frame Border Lines -->
  <line x1="30" y1="0" x2="30" y2="750" stroke="#ffffff" stroke-width="2" stroke-dasharray="10, 15" opacity="0.1" />
  <line x1="470" y1="0" x2="470" y2="750" stroke="#ffffff" stroke-width="2" stroke-dasharray="10, 15" opacity="0.1" />

  <!-- Center Decorative Glow -->
  <circle cx="250" cy="330" r="120" fill="url(#neon-grad)" opacity="0.15" filter="url(#glow)" />
  
  <!-- Movie Icon (Film) -->
  <g transform="translate(200, 260) scale(1.6)" opacity="0.85">
    <path d="M4 18h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2zM2 12h20M7 6v12M17 6v12M12 6v12" stroke="url(#neon-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Typography -->
  <text x="250" y="440" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="4">CINE<tspan fill="url(#neon-grad)">SWIPE</tspan></text>
  <text x="250" y="480" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#64748b" letter-spacing="1">POSTER UNAVAILABLE</text>
  
  <!-- Footer styling -->
  <rect x="200" y="520" width="100" height="2" rx="1" fill="#334155" />
</svg>
